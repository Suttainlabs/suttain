        <h1>Suttain — Chemical Safety, Formulation &amp; Molecular Research</h1>
        <p>Suttain is a platform for chemical safety analysis, formula generation, and product scanning. JavaScript is required to use the full application.</p>
        <h2>Key Features</h2>
        <ul>
          <li><strong>Chemical Analysis</strong> — Test chemical combinations safely before mixing. Get instant hazard analysis and reaction predictions.</li>
          <li><strong>Formula Generator</strong> — Create professional skincare, soap, and cleaning product formulas with AI-powered ingredient recommendations and safety validation.</li>
          <li><strong>SuttainScan</strong> — Scan any product barcode to instantly analyze ingredients, get safety ratings, and find healthier alternatives.</li>
          <li><strong>Hydration Intelligence</strong> — Track daily water intake with biological, food-linked adjustments personalized to your body.</li>
          <li><strong>Research Portal</strong> — Molecular intelligence, computational simulation, and API access for professional chemists and scientists. Powered by PubChem, ChEMBL, and EPA CompTox.</li>
        </ul>
